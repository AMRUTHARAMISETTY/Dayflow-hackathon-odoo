spring:
  application.name: dayflow-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dayflow}
    username: ${SPRING_DATASOURCE_USERNAME:dayflow}
    password: ${SPRING_DATASOURCE_PASSWORD:dayflow}
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
dayflow:
  cors-origin: ${DAYFLOW_CORS_ORIGIN:http://localhost:5173}
  seed-demo-data: ${DAYFLOW_SEED_DEMO_DATA:true}
  security:
    jwt-secret: ${DAYFLOW_JWT_SECRET:dev-only-secret-key-change-in-production-please-32bytes+}
    access-token-minutes: ${DAYFLOW_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${DAYFLOW_REFRESH_TOKEN_DAYS:7}
    invitation-hours: ${DAYFLOW_INVITATION_HOURS:72}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
