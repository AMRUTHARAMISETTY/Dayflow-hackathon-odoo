spring:
  application.name: dayflow-auth
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dayflow}
    username: ${DATABASE_USERNAME:dayflow}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    validate-migration-naming: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      ssl.checkserveridentity: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet.session.cookie:
    http-only: true
    secure: ${COOKIE_SECURE:true}
    same-site: strict
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /docs
dayflow:
  app-origin: ${APP_ORIGIN:http://localhost:5173}
  company-domain: ${COMPANY_EMAIL_DOMAIN:dayflow.example}
  jwt-secret: ${JWT_SECRET:}
  access-token-minutes: 10
  refresh-token-days: 30
  cookie-secure: ${COOKIE_SECURE:true}
  mail-from: ${MAIL_FROM:security@dayflow.example}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: Dayflow
    allowed-origin: ${WEBAUTHN_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging.level:
  root: INFO
  org.springframework.security: WARN
