services:
  dayflow-api:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /app
    volumes:
      - ./backend:/app
      - dayflow-m2:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/dayflow-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
      DAYFLOW_CORS_ORIGIN: http://localhost:5173
  dayflow-web:
    image: node:26
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8080
    depends_on:
      - dayflow-api
volumes:
  dayflow-m2:
