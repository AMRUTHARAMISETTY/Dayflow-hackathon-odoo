services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dayflow
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["dayflow-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  dayflow-postgres:
